# Deploys the dashboard Worker to Cloudflare on every push to main.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (same token as the AiFyn website repo).
# The database schema is owned by the website repo (its deploy applies the D1 migrations).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7643492cc224f3df90740d2c4fc409ba
          command: deploy
